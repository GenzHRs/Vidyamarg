services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: vidyamarg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: vidyamarg
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidyamarg"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql://vidyamarg:${POSTGRES_PASSWORD}@postgres:5432/vidyamarg
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      HR_SYNC_SECRET: ${HR_SYNC_SECRET:-}
      ADMIN_REGISTRATION_KEY: ${ADMIN_REGISTRATION_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      STORAGE_DIR: /app/storage
      SCHEDULER_ENABLED: "false"
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes: ["uploads:/app/storage"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  scheduler:
    build: ./backend
    profiles: ["discovery"]
    command: ["python", "-m", "app.core.scheduler_runner"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vidyamarg:${POSTGRES_PASSWORD}@postgres:5432/vidyamarg
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /app/storage
    volumes: ["uploads:/app/storage"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  migrate:
    build: ./backend
    profiles: ["migration"]
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://vidyamarg:${POSTGRES_PASSWORD}@postgres:5432/vidyamarg
    depends_on:
      postgres: {condition: service_healthy}
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
        NEXT_PUBLIC_HR_AGENT_API_URL: ${NEXT_PUBLIC_HR_AGENT_API_URL:-}
    ports: ["3000:3000"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  uploads:
