        <rect x="30" y="282" width="95" height="4" rx="2" fill="#334155" />
        <circle cx="35" cy="292" r="1.5" fill="#0d9488"/>
        <rect x="42" y="290" width="200" height="3" rx="1.5" fill="#64748b" />
        <circle cx="35" cy="300" r="1.5" fill="#0d9488"/>
        <rect x="42" y="298" width="180" height="3" rx="1.5" fill="#64748b" />
        

  <!-- Bottom Accent / Brand Badge -->
  <rect x="15" y="342" width="250" height="23" rx="0" fill="#0d9488" fill-opacity="0.05"/>
  <text x="25" y="357" font-family="Inter, system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#0d9488">Fresher Resume</text>
  <text x="255" y="357" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="700" fill="#10b981">98% ATS</text>
