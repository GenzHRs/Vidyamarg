        <rect x="30" y="136" width="85" height="4" rx="2" fill="#334155" />
        <rect x="210" y="136" width="40" height="4" rx="2" fill="#94a3b8" />
        <circle cx="35" cy="146" r="1.5" fill="#0d9488"/>
        <rect x="42" y="144" width="200" height="3" rx="1.5" fill="#64748b" />
        <circle cx="35" cy="154" r="1.5" fill="#0d9488"/>
        <rect x="42" y="152" width="185" height="3" rx="1.5" fill="#64748b" />

        <!-- Section 2: Education -->
        <rect x="30" y="170" width="60" height="6" rx="2" fill="#0d9488" />
