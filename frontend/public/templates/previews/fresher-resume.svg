        <circle cx="35" cy="198" r="1.5" fill="#0d9488"/>
        <rect x="42" y="196" width="190" height="3" rx="1.5" fill="#64748b" />

        <!-- Section 3: Skills -->
        <rect x="30" y="214" width="50" height="6" rx="2" fill="#0d9488" />
        <line x1="30" y1="224" x2="250" y2="224" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="30" y="232" width="220" height="3" rx="1.5" fill="#64748b" />
        <rect x="30" y="240" width="205" height="3" rx="1.5" fill="#64748b" />
