        <circle cx="35" cy="116" r="1.5" fill="#0d9488"/>
        <rect x="42" y="114" width="195" height="3" rx="1.5" fill="#64748b" />
        <circle cx="35" cy="124" r="1.5" fill="#0d9488"/>
